<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Commit Cleaner</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="url"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background-color: #0056b3; }
        .error { color: red; margin-bottom: 10px; }
        .results-section { margin-top: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #eee; padding: 10px; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Commit Cleaner</h1>
        <form method="POST" action="{{ url_for('index') }}">
            <label for="repo_url">GitHub Repository URL:</label>
            <input type="url" id="repo_url" name="repo_url" required placeholder="e.g., https://github.com/user/repo" value="{{ repo_url if repo_url }}">
            <input type="submit" name="fetch_branches" value="Fetch Branches">
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if branches %}
        <div class="results-section">
            <h2>Select a Branch:</h2>
            <form method="POST" action="{{ url_for('commits_for_branch') }}">
                <input type="hidden" name="repo_url" value="{{ repo_url }}">
                <label for="branch_name">Branch:</label>
                <select name="branch_name" id="branch_name" required>
                    <option value="">-- Select a Branch --</option>
                    {% for branch in branches %}
                        <option value="{{ branch.name }}">{{ branch.name }}</option>
                    {% endfor %}
                </select>
                <input type="submit" value="List Commits for Branch">
            </form>
        </div>
        {% endif %}

        {% if commits %}
        <div class="results-section">
            <h2>Commits for branch '{{ selected_branch_name }}' (Latest 30)</h2>
            <form method="POST" action="{{ url_for('select_commit') }}">
                <input type="hidden" name="repo_url" value="{{ repo_url }}">
                <input type="hidden" name="branch_name" value="{{ selected_branch_name }}"> {# Pass branch name along #}
                <ul>
                    {% for commit in commits %}
                    <li>
                        <input type="radio" name="commit_sha" value="{{ commit.sha }}" id="commit_{{ loop.index }}" {% if loop.first %}checked{% endif %}>
                        <label for="commit_{{ loop.index }}">
                            <strong>{{ commit.message }}</strong> ({{ commit.sha[:7] }})<br>
                            <small>Author: {{ commit.author }} | Date: {{ commit.date }}</small>
                        </label>
                    </li>
                    {% endfor %}
                </ul>
                <input type="submit" value="Scan Selected Commit">
            </form>
        </div>
        {% endif %}
    </div>
</body>
</html>
